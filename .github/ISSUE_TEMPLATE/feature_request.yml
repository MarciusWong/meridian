name: Feature request
description: Suggest an improvement or a new check
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like Meridian to do?
  - type: textarea
    id: alternatives
    attributes:
      label: Anything else? (tools, data sources, examples)
