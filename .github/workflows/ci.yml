name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Lint, typecheck, test and build (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker:
    name: Docker image builds and starts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t meridian:ci .
      - name: Smoke test
        run: |
          docker run -d --name meridian -p 8787:8787 meridian:ci
          for i in $(seq 1 30); do curl -fsS http://localhost:8787/api/health && break; sleep 1; done
          curl -fsS http://localhost:8787/ | grep -q '<div id="root">'
          curl -fsS http://localhost:8787/api/config | grep -q '"localChrome":true'
      - if: failure()
        run: docker logs meridian
