<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Meridian — global page speed</title>
    <meta
      name="description"
      content="Test how fast a website loads from cities on every continent and get a prioritised list of fixes. Free and open source."
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f6f5f1" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0d0d0d" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Meridian" />
    <meta property="og:title" content="Meridian — how fast is your site, everywhere?" />
    <meta
      property="og:description"
      content="Load your page from London, Frankfurt, Sydney, São Paulo, Tokyo and more, then get a ranked list of what to fix."
    />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />

    <script>
      try {
        var theme = localStorage.getItem('meridian-theme');
        if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme;
      } catch (e) {}
    </script>
  </head>
  <body>
    <noscript>Meridian needs JavaScript to run speed tests.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
